name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build (CI=true — warnings fail the build, same as Vercel)
        run: npm run build
        env:
          CI: 'true'

  server:
    name: Server (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Node syntax-check all server source files
        run: |
          set -e
          find src -name '*.js' -print0 | xargs -0 -I {} node --check {}
      - name: Smoke-boot server (loads every module, exits in 5s)
        run: |
          timeout 5 node src/index.js || code=$?
          # exit 124 = timeout (expected — means server started and was killed)
          # anything else = module load / boot failure
          if [ "${code:-0}" != "124" ] && [ "${code:-0}" != "0" ]; then
            echo "Server failed to boot (exit code $code)"
            exit 1
          fi
        env:
          OPENROUTER_API_KEY: ci-dummy
          GOOGLE_AI_API_KEY: ci-dummy
          JWT_SECRET: ci-dummy
