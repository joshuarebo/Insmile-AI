services:
  - type: web
    name: insmile-ai-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_TEXT_MODELS
        value: openai/gpt-oss-120b:free,z-ai/glm-4.5-air:free,openrouter/free,google/gemma-3-27b-it:free,meta-llama/llama-3.3-70b-instruct:free
      - key: OPENROUTER_VISION_MODELS
        value: google/gemma-3-4b-it:free,google/gemma-3-12b-it:free,google/gemma-3-27b-it:free,nvidia/nemotron-nano-12b-v2-vl:free,google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,openrouter/free
      - key: GOOGLE_AI_TEXT_MODELS
        value: gemini-flash-latest,gemini-2.5-flash,gemini-2.0-flash
      - key: GOOGLE_AI_VISION_MODELS
        value: gemini-flash-latest,gemini-2.5-flash,gemini-2.0-flash
      - key: HF_ENDPOINT_URL
        value: https://joshuarebo-insmile-dental-api.hf.space
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL_ID
        value: joshuarebo/insmile-dental-vision-lora
      - key: HF_PROVIDER_MODE
        value: shadow
      - key: HF_TIMEOUT
        value: "180000"
